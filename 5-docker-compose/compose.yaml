name: hello-api

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
  
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

volumes:
  redis-data: